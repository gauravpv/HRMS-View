<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/hrms-head :: hrmsHead('Not Found', false)}"></head>
<body class="font-sans bg-background flex items-center justify-center min-h-screen p-lg">
<article class="hrms-panel max-w-md w-full text-center">
    <div class="hrms-panel-accent"></div>
    <div class="hrms-panel-body py-xl">
        <div class="hrms-empty-state-icon mx-auto is-visible" style="display:flex">
            <span class="material-symbols-outlined">person_off</span>
        </div>
        <h1 class="font-headline-md text-primary mb-sm">Account pending approval</h1>
        <p class="font-body-md text-on-surface-variant mb-lg">An administrator must activate your account before you can use HRMS.</p>
        <a th:href="@{/logout}" class="hrms-btn hrms-btn-primary">Sign out</a>
    </div>
</article>
</body>
</html>
