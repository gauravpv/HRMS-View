</head>

<style>
    .required:after {
        content:" *";
        color: red;
      }

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <sec:authorize></sec:authorize>

        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar" th:insert="SideBar::SideBar"></ul>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <section th:insert="Navbar::Navbar"></section>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">


                    <div class="row">
                        <!-- <div class="col-lg-6 d-none d-lg-block bg-login-image"></div> -->
                        <div class="col-lg-8">
                            <div class="p-3">
                                <h1 class="text-center" th:text="${msg}"></h1>
                                <div class="text-center">
                                    <h1 class="h4 text-gray-900 mb-4">Move To Master</h1>
                                </div>
                                <form class="user" id="frmStudent">



                                    <!-- 	<div class="form-group row">
										<div class="col-sm-4">
											<label class="required"> Table Name</label>
										</div>
										<div class="col-sm-5">
											<div class="form-groupx">
											<span class="d-block" th:each="table: ${tableMasterList}">
												<input type="checkbox" th:id="${table}" th:name="${table}" th:value="${table}">
												<label th:for="${table}" th:text="${#strings.replace(table,'_master','')}"></label>
											</span>
											<small class="form-text text-danger ml-2 tab-name-msg"></small>
											</div>
										</div>
									</div> -->

                                    <div class="form-group row">
                                        <div class="col-sm-4">
                                            <label class="required">Table Name</label>
                                        </div>
                                        <div class="col-sm-8">
                                            <div class="dropdown">
                                                <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                                    Select Tables
                                                </button>
                                                <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                                    <!-- Use a container for dropdown items -->
                                                    <div class="dropdown-container">
                                                        <!-- Use a single parent div for each dropdown item -->
                                                        <div class="dropdown-item" th:each="table: ${tableMasterList}">
                                                            <input type="checkbox" class="table-checkbox" th:id="'checkbox_' + ${table}" th:name="'checkbox_' + ${table}" th:value="${table}">
                                                            <label for="'checkbox_' + ${table}" th:text="${#strings.replace(table,'_master','')}"></label>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                            <small class="form-text text-danger ml-2 tab-name-msg"></small>
                                        </div>
                                    </div>



                                    <script type="text/javascript">
                                        function validate(){
                                        										let f = true;
                                        										var checkedBoxes = $('input[type="checkbox"]:checked')
                                        										if(checkedBoxes.length == 0){
                                        											$('.tab-name-msg').html('Please select atleast one table').addClass("text-danger");
                                        											f = false;
                                        										}
                                        										if(f){
                                        											$('.tab-name-msg').html('')
                                        											$("#message")
                                        											.html("Are you sure?")
                                        											$("#exampleModalCenter").modal('show'); 
                                        										}	
                                        											
                                        										}
                                        									
                                        									function accept(){
                                        										$("#loader").modal('show')
                                        										var checkedBoxes = []
                                        										$('input[type="checkbox"]:checked').each(function(){
                                        											checkedBoxes.push(this.value)
                                        										})
                                        										var stringList = {stringList: checkedBoxes}
                                        										 $.post('/api/user/masterDataMovement' ,stringList, 
                                        											    function(resp){
                                        											$("#exampleModalCenter").modal('hide');
                                        											$("#msg").html(resp.msg)
                                        											$("#loader").modal('hide')
                                        							            	$("#successModal").modal('show');
                                        											}).fail(function(err){
                                        												$("#exampleModalCenter").modal("hide")
                                        											      $("#msg").html(err.responseJSON.errorMsg)
                                        											      $("#loader").modal('hide')
                                        									            	$("#successModal").modal('show');
                                        											}); 
                                        									}
                                    </script>
                                    <button type="button" class="btn btn-primary" onclick="validate()">Submit</button>
                                    <a href="addTable" class="btn btn-primary"> Back </a>
                                </form>
                            </div>
                        </div>
                    </div>


                    <!-- Page Heading -->

                    <script type="text/javascript">
                        function myFunction() {
                        			        	
                        						  var x = document.getElementById("myDIV");
                        						  if (x.style.display === "none") {
                        						    x.style.display = "";
                        						  } else {
                        						    x.style.display = "none";
                        						  }
                        						}
                    </script>





                </div>

                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white" th:insert="Footer::Footer">
            </footer>

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top"> <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Ready to Leave?</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">Select "Logout" to end your current session.</div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                    <a class="btn btn-primary" href="logout">Logout</a>
                </div>
            </div>
        </div>
    </div>
    <div class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLongTitle">Message</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="message"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" onclick='accept()'>Accept</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Reject</button>

                </div>
            </div>
        </div>
    </div>
    <!-- success modal -->
    <div class="modal fade" id="successModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLongTitle">Message</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body" id="msg"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>

                </div>
            </div>
        </div>
    </div>

    <!-- Loading Modal -->

    <div class="modal" id="loader" tabindex="-1" role="dialog" aria-labelledby="loaderTitle" aria-hidden="true" data-backdrop="static" data-keyboard="false">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <!-- <div class="modal-content"> -->
            <div class="modal-body">
                <img src="../static/img/loading.gif" class="center" th:src="@{img/loading.gif}"></img>
            </div>
            <!-- </div> -->
        </div>
    </div>

    <!-- Profile Modal  -->
    <div class="modal fade" id="profileModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Profile</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <!-- <div class="modal-body">Profile Info</div> -->
                <div class="modal-body mx-3">
                    <div class="md-form mb-4">
                        User Name :=
                        <h4 th:text="${session.userName}"></h6>

                    </div>

                    <div class="md-form mb-4">
                        <label>Email :=
                            <h6 th:text="${session.email}"></h6>
                        </label>

                    </div>

                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" type="button" data-dismiss="modal">Back</button>
                    <!-- <a class="btn btn-primary" href="logout">Logout</a> -->
                </div>
            </div>
        </div>
    </div>
