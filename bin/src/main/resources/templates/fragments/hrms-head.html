<head th:fragment="hrmsHead(pageTitle, needsDataTables)" xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="hrms-session-timeout-minutes" th:content="${sessionTimeoutMinutes}"/>
    <meta name="hrms-session-expired-url" th:content="@{/session-expired}"/>
    <title th:text="${pageTitle} + ' | HRMS'">HRMS</title>
    <link rel="preload" th:href="@{/vendor/fonts/material-symbols-outlined/material-symbols-outlined-latin-400-normal.woff2}" as="font" type="font/woff2" crossorigin="anonymous"/>
    <link rel="preload" th:href="@{/vendor/fonts/inter/inter-latin-400-normal.woff2}" as="font" type="font/woff2" crossorigin="anonymous"/>
    <link rel="stylesheet" th:href="@{/css/hrms-vendor-fonts.css}"/>
    <link rel="stylesheet" th:href="@{/css/hrms-tailwind.css}"/>
    <link rel="stylesheet" th:href="@{/css/hrms-design-tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/hrms-layout.css}"/>
    <link rel="stylesheet" th:href="@{/css/hrms-theme.css}"/>
    <link rel="stylesheet" th:href="@{/css/hrms-data-pages.css}"/>
    <link th:if="${needsDataTables}" rel="stylesheet" th:href="@{/vendor/datatables/dataTables.bootstrap4.min.css}"/>
    <style>
        html, body { font-family: var(--hrms-font-sans); }
    </style>
</head>
