<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/hrms-head :: hrmsHead('History Data', true)}"></head>
<body class="font-sans bg-background text-on-surface">
<th:block th:replace="~{fragments/hrms-sidebar :: hrmsSidebar('history-data')}"></th:block>
<main id="hrms-main" class="ml-[260px] min-h-screen flex flex-col pt-16">
    <th:block th:replace="~{fragments/hrms-header :: hrmsHeader('History Data')}"></th:block>
    <div class="hrms-page-canvas flex-1">
        <section class="hrms-data-toolbar" aria-label="Snapshot filters">
            <div class="hrms-data-toolbar__main">
                <div class="hrms-data-toolbar__fields hrms-data-toolbar__fields--history">
                    <div class="hrms-data-toolbar__row hrms-data-toolbar__row--pair">
                        <div class="hrms-field">
                            <label for="tableTemp">Table type</label>
                            <div class="hrms-select-wrap">
                                <span class="material-symbols-outlined hrms-select-leading">category</span>
                                <select id="tableTemp" onchange="getTable()" class="hrms-select">
                                    <option value="master" selected>Master</option>
                                </select>
                                <span class="material-symbols-outlined hrms-select-chevron">expand_more</span>
                            </div>
                        </div>
                        <div class="hrms-field">
                            <label for="tableName">Table name</label>
                            <div class="hrms-select-wrap">
                                <span class="material-symbols-outlined hrms-select-leading">table_rows</span>
                                <select id="tableName" class="hrms-select">
                                    <option value="">Choose table…</option>
                                </select>
                                <span class="material-symbols-outlined hrms-select-chevron">expand_more</span>
                            </div>
                        </div>
                    </div>
                    <div class="hrms-data-toolbar__row hrms-data-toolbar__row--history-actions">
                        <div class="hrms-field">
                            <label>Date range</label>
                            <div class="hrms-date-range">
                                <div class="hrms-date-wrap">
                                    <span class="material-symbols-outlined hrms-date-icon" aria-hidden="true">event</span>
                                    <span class="hrms-date-display is-placeholder" data-placeholder="YYYY-MM-DD" aria-hidden="true">YYYY-MM-DD</span>
                                    <input type="date" id="fromDate" class="hrms-date-input" aria-label="From date"/>
                                </div>
                                <span class="hrms-date-separator" aria-hidden="true">to</span>
                                <div class="hrms-date-wrap">
                                    <span class="material-symbols-outlined hrms-date-icon" aria-hidden="true">event</span>
                                    <span class="hrms-date-display is-placeholder" data-placeholder="YYYY-MM-DD" aria-hidden="true">YYYY-MM-DD</span>
                                    <input type="date" id="toDate" class="hrms-date-input" aria-label="To date"/>
                                </div>
                            </div>
                        </div>
                        <div class="hrms-field" id="historyIdRow" style="visibility:hidden">
                            <label for="historyId">Snapshot</label>
                            <div class="hrms-select-wrap">
                                <span class="material-symbols-outlined hrms-select-leading">history</span>
                                <select id="historyId" class="hrms-select">
                                    <option value="">Choose snapshot…</option>
                                </select>
                                <span class="material-symbols-outlined hrms-select-chevron">expand_more</span>
                            </div>
                        </div>
                        <div class="hrms-data-toolbar__actions">
                            <button type="button" onclick="search()" class="hrms-btn hrms-btn-outline">
                                <span class="material-symbols-outlined" aria-hidden="true">list_alt</span>
                                <span class="hrms-btn__label">Find snapshots</span>
                            </button>
                            <button type="button" onclick="searchHistory()" class="hrms-btn hrms-btn-primary">
                                <span class="material-symbols-outlined" aria-hidden="true">database</span>
                                <span class="hrms-btn__label">Load records</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="hrms-data-results" aria-label="Historical records">
            <div class="hrms-results-block">
                <div class="hrms-results-header">
                    <h3><span class="material-symbols-outlined text-secondary text-[22px]">inventory_2</span> Historical records</h3>
                    <div class="hrms-results-header__meta">
                        <span class="hrms-badge">Audit trail</span>
                        <button type="button" onclick="tableToCsv()" id="export-csv-btn" style="display:none" class="hrms-btn hrms-btn-outline hrms-btn-sm">
                            <span class="material-symbols-outlined" aria-hidden="true">download</span>
                            <span class="hrms-btn__label">Export</span>
                        </button>
                    </div>
                </div>
                <div id="no-data-message" class="hrms-empty-state">
                    <div class="hrms-empty-state-icon"><span class="material-symbols-outlined">folder_off</span></div>
                    <p class="font-headline-sm text-primary mb-xs">No history found</p>
                    <p class="font-body-sm text-on-surface-variant hrms-empty-detail">Adjust filters and load a snapshot.</p>
                </div>
                <div id="table-div" style="visibility:hidden" class="hrms-table-shell data-table-container">
                    <table id="dataTable" class="w-full hrms-data-table"><thead><tr></tr></thead><tbody></tbody></table>
                </div>
            </div>
        </section>
    </div>
</main>
<th:block th:replace="~{fragments/hrms-modals :: hrmsModals}"></th:block>
<th:block th:replace="~{fragments/hrms-scripts :: hrmsScripts(true)}"></th:block>
<script th:src="@{/js/hrms-api-error.js}"></script>
<script th:src="@{/js/hrms-table-select.js}"></script>
<script th:src="@{/js/hrms-history-data.js}"></script>
<script th:inline="javascript">var tabList = /*[[${tabList}]]*/ []; var tabTempList = /*[[${tabTempList}]]*/ [];</script>
</body>
</html>
