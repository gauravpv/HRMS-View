spring.application.name=hrms-view

# Canonical table catalog (search, history, bulk upload, data movement)
app.table-details.catalog=decision_rules_hrmsbre
# Main table data (counts / last updated) for Table Status
app.business-schema=hrms_bre
# Copy application-*-mysql.properties.example → application-*-mysql.properties (gitignored).
# Override with SPRING_PROFILES_ACTIVE=mysql for production-only.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql,local-mysql}

# MySQL (shared; URL/credentials in profile-specific files)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never

# Authentication: true = Azure AD OAuth2 (requires internet to Microsoft), false = form login (offline LAN)
app.auth.azure.enabled=false
# Disable Azure SDK auto-config on servers with no outbound internet
spring.cloud.azure.enabled=false

# Idle session length (server + browser); sign-out after this period without activity
app.session.timeout-minutes=30
server.servlet.session.timeout=${app.session.timeout-minutes}m
spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.error.whitelabel.enabled=false
excel.validation=&'+<()@,=>/|_"{}`:.-

# SSL client (see SslConfiguration.java)
http.client.ssl.trust-store=classpath:keystore/hrmsdecisionrulesview_bajajfinserv_in.p12
http.client.ssl.trust-store-password=${SSL_TRUST_STORE_PASSWORD:PASSWORD}

# Log4j2 — see log4j2-spring.xml (framework WARN; com.app INFO for business events only)

# Static assets — browser cache + gzip (important on office LAN)
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,application/javascript,application/json,font/woff2,font/woff,image/svg+xml
server.compression.min-response-size=1024

# Table status / dashboard summary cache (seconds); 0 = always refresh
app.table-status.cache-seconds=300
