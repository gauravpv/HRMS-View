<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/hrms-head :: hrmsHead('Session Expired', false)}"></head>
<body class="font-sans bg-background flex items-center justify-center min-h-screen p-lg">
<article class="hrms-panel max-w-md w-full text-center">
    <div class="hrms-panel-accent"></div>
    <div class="hrms-panel-body py-xl">
        <div class="hrms-empty-state-icon mx-auto is-visible" style="display:flex">
            <span class="material-symbols-outlined">schedule</span>
        </div>
        <h1 class="font-headline-md text-primary mb-sm">Session expired</h1>
        <p class="font-body-md text-on-surface-variant mb-lg">
            Your session ended after <span th:text="${sessionTimeoutMinutes}">30</span> minutes of inactivity.
            Please sign in again to continue.
        </p>
        <a th:href="@{/login}" class="hrms-btn hrms-btn-primary">Sign in</a>
    </div>
</article>
</body>
</html>
