<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/hrms-head :: hrmsHead('Error', false)}"></head>
<body class="font-sans bg-background flex items-center justify-center min-h-screen p-lg">
<article class="hrms-panel max-w-md w-full text-center">
    <div class="hrms-panel-accent"></div>
    <div class="hrms-panel-body py-xl">
        <div class="hrms-empty-state-icon mx-auto is-visible" style="display:flex">
            <span class="material-symbols-outlined text-error">block</span>
        </div>
        <h1 class="font-headline-md text-primary mb-sm">Something went wrong</h1>
        <p class="font-body-md text-on-surface-variant mb-lg">Your account may be inactive, you may lack permission for this page, or a server error occurred. Try signing in again or contact an administrator.</p>
        <a th:href="@{/logout}" class="hrms-btn hrms-btn-primary">Sign out</a>
    </div>
</article>
</body>
</html>
