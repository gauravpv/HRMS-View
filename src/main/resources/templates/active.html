<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>User List</title>

    <!-- Custom fonts for this template -->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">


    <!-- Custom styles for this template -->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">

    <!-- Custom styles for this page -->
    <link href="vendor/datatables/dataTables.bootstrap4.min.css" rel="stylesheet">

</head>

<style>
    .required:after {
    	content: " *";
    	color: red;
    }
</style>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
		<ul
				    class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion"
				    id="accordionSidebar" th:insert="~{SideBar::SideBar}"></ul>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <section th:insert="~{Navbar::Navbar}"></section>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid">

                    <div class="row">
                        <div class="col-lg-12">



                            <div id="first" class="card shadow mb-4">
                                <div class="card-header py-3">
                                    <h4 class="m-0 font-weight-bold text-primary" style="display: inline;">Users</h4>
                                    <select class="form-select" aria-label="Default select example" style="margin-left: 2%;">
                                        <option selected onchange="location = this.value;">Status</option>
                                        <option value="active">Active</option>
                                        <option value="inActive">Inactive</option>
                                        <option value="users">All Users</option>
                                    </select>
                                </div>
                                <form class="user" method="post" action="upload">
                                    <div class="card-body">
                                        <!-- <button class="btn btn-success float-left">Add</button> -->
                                        <div class="table-responsive">
                                            <table class="table table-bordered hidden" id="dataTable" width="100%" cellspacing="0">

                                                <thead>
                                                    <tr>

                                                        <th>User Name</th>
                                                        <th>Email</th>
                                                        <th sec:authorize="hasAuthority('ADMIN')">Action</th>
                                                </thead>

                                                <tbody>

                                                    <tr th:each="get :${getUser}">
                                                        <td th:text="${get.userName}" name="u-name"></td>
                                                        <td th:text="${get.email}" name="email"></td>
                                                        <td sec:authorize="hasAuthority('ADMIN')">
                                                            <a th:href="@{/deActive(id=${get.userId})}" class="btn btn-danger ">&#10539; </a></td>


                                                    </tr>
                                                </tbody>

                                </form>

                                </table>
                                </div>
                                </div>
                            </div>

                        </div>
                    </div>

                    <hr>
                    <!-- <div class="row">
					
						
										
			

					<!-- Page Heading -->

                    <script type="text/javascript">
                        function myFunction() {
                        
                        							var x = document.getElementById("myDIV");
                        							if (x.style.display === "none") {
                        								x.style.display = "";
                        							} else {
                        								x.style.display = "none";
                        							}
                        						}
                        						
                        						const select = document.querySelector("select")
                        						select.onchange = () => {
                        						  if (select.selectedIndex !== 0) {
                        						    window.location.href = select.value;
                        						  }
                        						};
                    </script>





                </div>

                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
           <footer class="sticky-footer bg-white" th:insert="~{Footer::Footer}"></footer>
            </footer>
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top"> <i class="fas fa-angle-up"></i>
    </a>

    <!-- Logout Modal-->
    <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Ready to Leave?</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <div class="modal-body">Select "Logout" to end your current session.
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" type="button" data-dismiss="modal">Cancel</button>
                    <a class="btn btn-primary" href="logout">Logout</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Profile Modal  -->
    <div class="modal fade" id="profileModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Profile</h5>
                    <button class="close" type="button" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
                <!-- <div class="modal-body">Profile Info</div> -->
                <div class="modal-body mx-3">
                    <div class="md-form mb-4">
                        User Name :=
                        <h6 th:text="${session.userName}"></h6>

                    </div>

                    <div class="md-form mb-4">
                        <label>Email :=
                            <h6 th:text="${session.email}"></h6>
                        </label>

                    </div>

                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" type="button" data-dismiss="modal">Back</button>
                    <!-- <a class="btn btn-primary" href="logout">Logout</a> -->
                </div>
            </div>
        </div>
    </div>



    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2.min.js"></script>

    <!-- Page level plugins -->
    <script src="vendor/datatables/jquery.dataTables.min.js"></script>
    <script src="vendor/datatables/dataTables.bootstrap4.min.js"></script>

    <!-- Page level custom scripts -->
    <script src="js/demo/datatables-demo.js"></script>



</body>

</html>
